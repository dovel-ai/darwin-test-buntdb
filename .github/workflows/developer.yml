name: Developer activity

# Once a day a simulated developer adds the next dependency (.github/fixture/developer.mjs) at an old release, with
# code that uses it and a test, and pushes it to the default branch: Darwin should find the newer release and propose
# it (migrating the code when it breaks), or hold it with the reason.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: developer
  cancel-in-progress: false

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Add the next dependency
        id: add
        run: |
          set -euo pipefail
          out=$(node .github/fixture/developer.mjs)
          echo "$out"
          node -e 'const d = JSON.parse(process.argv[1]); require("fs").writeFileSync(process.argv[2], d.message ?? ""); console.log(`module=${d.module ?? ""}`); console.log(`version=${d.version ?? ""}`); console.log(`probe=${d.probe ?? false}`)' "$out" "$RUNNER_TEMP/message.txt" >> "$GITHUB_OUTPUT"
      - name: Resolve, test and push
        if: steps.add.outputs.module != ''
        env:
          MODULE: ${{ steps.add.outputs.module }}
          VERSION: ${{ steps.add.outputs.version }}
          PROBE: ${{ steps.add.outputs.probe }}
        run: |
          set -euo pipefail
          go get "$MODULE@$VERSION"
          go mod tidy
          if [ "$PROBE" = true ]; then
            value=$(go test ./extras -run 'TestProbe' -v -count=1 | sed -n 's/.*PROBE=//p' | head -1)
            echo "The release gives today: $value"
            [ -n "$value" ]
            PROBE_VALUE="$value" node .github/fixture/developer.mjs > /dev/null
          fi
          new=$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep '\.go$' || true)
          [ -z "$new" ] || gofmt -w $new
          [ -z "$new" ] || go vet $(echo "$new" | xargs -n1 dirname | sort -u | sed 's#^#./#')
          go build ./...
          go test ./... -count=1
          git config user.name "fixture-developer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F "$RUNNER_TEMP/message.txt"
          git push origin HEAD
